name: Option of the day

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # only the spec is needed from Valhalla
      - uses: actions/checkout@v4
        with:
          repository: valhalla/valhalla
          path: valhalla
          sparse-checkout: docs/docs/api/openapi.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml

      - name: Update the spec and pick the option of the day
        run: |
          python scripts/option-of-the-day.py --spec valhalla/docs/docs/api/openapi.yaml
          python route-playground/generate-costing-options.py
          rm -rf valhalla

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.yaml index.html route-playground/costing-options.js
          git diff --cached --quiet || git commit -m 'Option of the day'
          git push
