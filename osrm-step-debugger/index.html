<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSRM format debugger</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #1f2937;
      }
      #panel {
        width: 380px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #d1d5db;
        background: #fff;
      }
      #map {
        flex: 1;
      }

      #saved {
        display: flex;
        gap: 6px;
        margin: 10px 10px 0;
      }
      #picker {
        flex: 1;
        min-width: 0;
      }
      #title,
      #description {
        flex: none;
        margin: 8px 10px 0;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font: inherit;
      }
      #title {
        font-weight: 600;
      }
      #description {
        height: 52px;
        resize: vertical;
      }

      #input {
        height: 130px;
        flex: none;
        margin: 10px;
        padding: 8px;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font:
          11px/1.4 ui-monospace,
          monospace;
      }
      #error,
      #storage-error {
        margin: 0 10px 8px;
        color: #b91c1c;
      }
      #error:empty,
      #storage-error:empty {
        display: none;
      }
      #routes {
        margin: 0 10px 8px;
      }
      #routes[hidden] {
        display: none;
      }

      #summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 0 10px 10px;
      }
      #summary:empty {
        display: none;
      }
      #summary div {
        padding: 6px 8px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      #summary small {
        display: block;
        color: #6b7280;
      }
      #summary b {
        font-variant-numeric: tabular-nums;
      }

      #steps {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid #e5e7eb;
      }
      #steps .leg {
        position: sticky;
        top: 0;
        padding: 6px 10px;
        background: #f3f4f6;
        font-weight: 600;
      }
      #steps .leg .bad {
        color: #b91c1c;
      }
      #steps .leg .ok {
        color: #15803d;
        font-weight: 400;
      }
      #steps .step {
        display: flex;
        gap: 8px;
        padding: 6px 10px 6px 0;
        border-bottom: 1px solid #f3f4f6;
        cursor: pointer;
      }
      #steps .step.active {
        background: #fef9c3;
      }
      .swatch {
        width: 4px;
        flex: none;
        border-radius: 0 2px 2px 0;
      }
      .instr {
        flex: 1;
        min-width: 0;
      }
      .instr small {
        display: block;
        color: #6b7280;
      }
      .metrics {
        flex: none;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .metrics small {
        display: block;
        color: #6b7280;
      }

      .step-label {
        padding: 1px 5px;
        background: #fff;
        border: 2px solid;
        border-radius: 4px;
        font:
          600 12px/1.3 ui-monospace,
          monospace;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
      }
      .step-label.active {
        background: #fef9c3;
        z-index: 1;
      }
      .turn-label {
        padding: 0 4px;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #dc2626;
        border-radius: 4px;
        font:
          600 11px/1.3 ui-monospace,
          monospace;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
      }
      .metrics .turns {
        color: #b91c1c;
      }
      .metrics .turns:empty {
        display: none;
      }
      .maplibregl-popup-content pre {
        margin: 0;
        font:
          11px/1.5 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <aside id="panel">
      <div id="saved">
        <select id="picker" title="Saved routes"></select>
        <button
          id="share"
          type="button"
          title="Copy a URL that contains this route"
        >
          Share
        </button>
        <button id="new" type="button">New</button>
        <button id="delete" type="button">Delete</button>
      </div>
      <input id="title" placeholder="Title" />
      <textarea id="description" placeholder="Description"></textarea>
      <textarea
        id="input"
        spellcheck="false"
        placeholder="Paste an OSRM-format response here…"
      ></textarea>
      <div id="storage-error"></div>
      <div id="error"></div>
      <select id="routes" hidden></select>
      <div id="summary"></div>
      <ol id="steps"></ol>
    </aside>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="index.js"></script>
  </body>
</html>
