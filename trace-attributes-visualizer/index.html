<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trace attributes visualizer</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #1f2937;
      }
      #panel {
        width: 380px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #d1d5db;
        background: #fff;
      }
      #map {
        flex: 1;
      }

      #saved {
        display: flex;
        gap: 6px;
        margin: 10px 10px 0;
      }
      #picker {
        flex: 1;
        min-width: 0;
      }
      #title,
      #description {
        flex: none;
        margin: 8px 10px 0;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font: inherit;
      }
      #title {
        font-weight: 600;
      }
      #description {
        height: 52px;
        resize: vertical;
      }

      #input {
        height: 130px;
        flex: none;
        margin: 10px;
        padding: 8px;
        resize: vertical;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font:
          11px/1.4 ui-monospace,
          monospace;
      }
      #error,
      #storage-error {
        margin: 0 10px 8px;
        color: #b91c1c;
      }
      #error:empty,
      #storage-error:empty {
        display: none;
      }
      #paths {
        margin: 0 10px 8px;
      }
      #paths[hidden],
      #themes[hidden] {
        display: none;
      }

      #summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 0 10px 10px;
      }
      #summary:empty {
        display: none;
      }
      #summary div {
        padding: 6px 8px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      #summary small {
        display: block;
        color: #6b7280;
      }
      #summary b {
        font-variant-numeric: tabular-nums;
      }

      #themes {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px 8px;
        align-items: center;
        margin: 0 10px 10px;
      }
      #themes select {
        min-width: 0;
      }
      #themes label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #themes input {
        margin: 0;
      }
      .legend {
        grid-column: 1 / -1;
        max-height: 120px;
        overflow-y: auto;
        font-variant-numeric: tabular-nums;
      }
      .legend:empty {
        display: none;
      }
      .legend .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .legend .row i {
        width: 10px;
        height: 10px;
        flex: none;
        border-radius: 2px;
      }
      .legend .row span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend .row small,
      .legend .ends {
        color: #6b7280;
      }
      .legend .ramp {
        height: 8px;
        border-radius: 4px;
      }
      .legend .ends {
        display: flex;
        justify-content: space-between;
      }

      #edges {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid #e5e7eb;
      }
      #edges .edge {
        display: flex;
        gap: 8px;
        padding: 6px 10px 6px 0;
        border-bottom: 1px solid #f3f4f6;
        cursor: pointer;
      }
      #edges .edge.active {
        background: #fef9c3;
      }
      .swatch {
        width: 4px;
        flex: none;
        border-radius: 0 2px 2px 0;
      }
      .instr {
        flex: 1;
        min-width: 0;
      }
      .instr small {
        display: block;
        color: #6b7280;
      }
      .metrics {
        flex: none;
        max-width: 45%;
        text-align: right;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .metrics small {
        display: block;
        color: #6b7280;
      }
      .metrics small:empty {
        display: none;
      }
      .metrics .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 4px;
        border: 1px solid #1f2937;
        border-radius: 50%;
      }

      /* labels let clicks through to the feature underneath */
      .edge-label,
      .node-label {
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        background: #fff;
        border: 2px solid;
        border-radius: 4px;
        font:
          600 11px/1.3 ui-monospace,
          monospace;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
      }
      .edge-label {
        padding: 1px 5px;
      }
      .node-label {
        padding: 0 4px;
        border-radius: 9px;
        font-weight: 400;
      }
      .maplibregl-popup-content pre {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          11px/1.5 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <aside id="panel">
      <div id="saved">
        <select id="picker" title="Saved traces"></select>
        <button
          id="share"
          type="button"
          title="Copy a URL that contains this trace"
        >
          Share
        </button>
        <button id="new" type="button">New</button>
        <button id="delete" type="button">Delete</button>
      </div>
      <input id="title" placeholder="Title" />
      <textarea id="description" placeholder="Description"></textarea>
      <textarea
        id="input"
        spellcheck="false"
        placeholder="Paste a Valhalla trace_attributes response here…"
      ></textarea>
      <div id="storage-error"></div>
      <div id="error"></div>
      <select id="paths" hidden></select>
      <div id="summary"></div>
      <div id="themes" hidden>
        <label><input id="edge-visible" type="checkbox" /> Edges</label>
        <select id="edge-theme"></select>
        <label><input id="edge-labels" type="checkbox" /> labels</label>
        <div id="edge-legend" class="legend"></div>
        <label><input id="node-visible" type="checkbox" /> Nodes</label>
        <select id="node-theme"></select>
        <label><input id="node-labels" type="checkbox" /> labels</label>
        <div id="node-legend" class="legend"></div>
      </div>
      <ol id="edges"></ol>
    </aside>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="index.js"></script>
  </body>
</html>
